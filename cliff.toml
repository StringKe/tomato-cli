# git-cliff 配置：按 `type(scope): 说明` 的 commit 生成 CHANGELOG.md 和 GitHub Release 说明
# 本地：git cliff --tag v0.2.0 -o CHANGELOG.md；CI：git cliff --latest --strip header

[changelog]
header = """# Changelog

按 commit 记录生成，分组依据是 commit 的 type。
"""
body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}]({% if previous.version %}https://github.com/StringKe/tomato-cli/compare/{{ previous.version }}...{{ version }}{% else %}https://github.com/StringKe/tomato-cli/releases/tag/{{ version }}{% endif %}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [未发布](https://github.com/StringKe/tomato-cli/compare/{{ previous.version }}...HEAD)
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}：{% endif %}{{ commit.message }}（{{ commit.id | truncate(length=7, end="") }}）
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(scoop\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->新功能" },
  { message = "^fix", group = "<!-- 1 -->修复" },
  { message = "^perf", group = "<!-- 2 -->性能" },
  { message = "^refactor", group = "<!-- 3 -->重构" },
  { message = "^docs", group = "<!-- 4 -->文档" },
  { message = "^build|^ci", group = "<!-- 5 -->构建与发版" },
  { message = ".*", group = "<!-- 6 -->其他" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
