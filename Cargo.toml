[package]
name = "tomato-cli"
version = "0.1.1"
edition = "2024"
description = "番茄小说终端阅读器"
license = "MIT"
repository = "https://github.com/StringKe/tomato-cli"
homepage = "https://github.com/StringKe/tomato-cli"
readme = "README.md"
keywords = ["fanqie", "novel", "tui", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "tomato"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
brotli = "8"
clap = { version = "4.6.7", features = ["derive"] }
cookie = "0.18.2"
directories = "6.0.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
html2text = "0.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = "0.14.1"
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
self_update = { version = "1.3.0", default-features = false, features = ["archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "reqwest", "github", "progress-bar"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sm3 = "0.5.0"
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
textwrap = { version = "0.16.4", features = ["unicode-width"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
tui-qrcode = "0.2.6"
unicode-width = "0.2.2"
urlencoding = "2.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
