name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Check static link
        if: matrix.musl
        run: file target/${{ matrix.target }}/release/tomato
      - name: Pack unix
        if: matrix.archive == 'tar.gz'
        run: |
          BIN=target/${{ matrix.target }}/release/tomato
          chmod +x "$BIN"
          tar -czf tomato-${{ matrix.target }}.tar.gz -C "target/${{ matrix.target }}/release" tomato
      - name: Pack windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tomato.exe -DestinationPath tomato-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: tomato-${{ matrix.target }}.*

  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            scripts/install.sh
            scripts/install.ps1
      - name: Sync Scoop manifest
        run: scripts/sync-scoop.sh "${GITHUB_REF_NAME#v}"
      - name: Commit Scoop manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/tomato.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(scoop): 同步 ${GITHUB_REF_NAME} 的 manifest"
          git push origin HEAD:main
      - name: Trigger Homebrew tap sync
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.GH_TOKEN != ''
        run: gh workflow run sync.yml --repo StringKe/homebrew-tap
